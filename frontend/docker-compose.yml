services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — see Dockerfile.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    image: log-visualization-frontend:latest
    container_name: log-visualization-frontend
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    # Uncomment if you keep secrets/overrides in a local .env file
    # (see .env.example). Never commit the real .env file.
    # env_file:
    #   - .env
